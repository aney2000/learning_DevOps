<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Crimson+Pro:ital,wght@0,300;0,600;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0806;
    font-family: 'Crimson Pro', serif;
    overflow: hidden;
    color: #c8a96e;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0a0806;
    z-index: 100;
  }

  .login-box {
    text-align: center;
    padding: 3rem 3.5rem;
    border: 1px solid #3a2e1e;
    background: #100e0a;
    position: relative;
  }

  .login-box::before, .login-box::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border-color: #c8a96e;
    border-style: solid;
  }
  .login-box::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .login-box::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .rune {
    font-size: 2.8rem;
    letter-spacing: 0.4em;
    color: #4a3820;
    margin-bottom: 0.3rem;
    user-select: none;
  }

  .login-title {
    font-family: 'Crimson Pro', serif;
    font-size: 2.4rem;
    font-weight: 600;
    color: #c8a96e;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .login-sub {
    font-size: 0.95rem;
    color: #5a4a30;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  .login-label {
    display: block;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #7a6040;
    margin-bottom: 0.6rem;
    text-align: left;
  }

  .login-input {
    width: 100%;
    background: #0e0c09;
    border: 1px solid #3a2e1e;
    border-bottom-color: #c8a96e;
    color: #e8c88e;
    font-family: 'Crimson Pro', serif;
    font-size: 1.3rem;
    padding: 0.7rem 1rem;
    outline: none;
    letter-spacing: 0.1em;
    transition: border-color 0.3s;
    margin-bottom: 2rem;
  }

  .login-input:focus {
    border-color: #c8a96e;
    background: #131008;
  }

  .login-btn {
    width: 100%;
    background: transparent;
    border: 1px solid #c8a96e;
    color: #c8a96e;
    font-family: 'Crimson Pro', serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    padding: 0.85rem 2rem;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .login-btn:hover {
    background: #c8a96e;
    color: #0a0806;
  }

  .login-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ── GAME UI ── */
  #game-screen { position: fixed; inset: 0; display: none; }

  #three-canvas { width: 100%; height: 100%; display: block; }

  /* Top bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem;
    background: linear-gradient(to bottom, rgba(8,6,4,0.95), transparent);
    pointer-events: none;
  }

  #topbar-title {
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #5a4a30;
  }

  #end-btn {
    pointer-events: all;
    background: transparent;
    border: 1px solid #5a3a1a;
    color: #8a6030;
    font-family: 'Crimson Pro', serif;
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 0.45rem 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  #end-btn:hover { border-color: #c8a96e; color: #c8a96e; }

  /* Timer */
  #timer-display {
    position: fixed; bottom: 1.2rem; left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    color: #3a2e1e;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* Controls hint */
  #controls-hint {
    position: fixed; bottom: 1.2rem; right: 1.5rem;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: #2a2018;
    text-transform: uppercase;
    line-height: 1.8;
    text-align: right;
    pointer-events: none;
    transition: opacity 1s;
  }

  /* ── STATS SCREEN ── */
  #stats-screen {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(8,6,4,0.97);
    z-index: 200;
  }

  .stats-box {
    text-align: center;
    padding: 3rem 4rem;
    border: 1px solid #3a2e1e;
    background: #0d0b08;
    min-width: 400px;
    position: relative;
  }

  .stats-box::before, .stats-box::after {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border-color: #c8a96e;
    border-style: solid;
  }
  .stats-box::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .stats-box::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .stats-title {
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #5a4a30;
    margin-bottom: 2.5rem;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.6rem 0;
    border-bottom: 1px solid #1e1810;
    gap: 3rem;
  }

  .stat-label {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #5a4a30;
  }

  .stat-value {
    font-size: 1.6rem;
    font-weight: 600;
    color: #c8a96e;
    font-variant-numeric: tabular-nums;
  }

  .stat-unit {
    font-size: 0.75rem;
    color: #5a4a30;
    margin-left: 0.3rem;
  }

  .farewell {
    margin-top: 2rem;
    font-style: italic;
    font-size: 1rem;
    color: #4a3820;
    letter-spacing: 0.05em;
  }

  .stats-play-again {
    margin-top: 2.5rem;
    background: transparent;
    border: 1px solid #3a2e1e;
    color: #7a6040;
    font-family: 'Crimson Pro', serif;
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    padding: 0.7rem 2rem;
    cursor: pointer;
    transition: all 0.25s;
  }
  .stats-play-again:hover { border-color: #c8a96e; color: #c8a96e; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="rune">⚔ ☽ ⚔</div>
    <div class="login-title">Dungeon</div>
    <div class="login-sub">Enter if you dare</div>
    <label class="login-label">Thy name, wanderer</label>
    <input type="text" id="name-input" class="login-input" maxlength="18" placeholder="..." autocomplete="off" spellcheck="false">
    <button class="login-btn" id="enter-btn" disabled>Enter the Dungeon</button>
  </div>
</div>

<!-- GAME -->
<div id="game-screen">
  <canvas id="three-canvas"></canvas>
  <div id="topbar">
    <span id="topbar-title">Dungeon · Phase I</span>
    <button id="end-btn">End Run</button>
  </div>
  <div id="timer-display">00:00</div>
  <div id="controls-hint">WASD · Arrow Keys<br>to move</div>
</div>

<!-- STATS -->
<div id="stats-screen">
  <div class="stats-box">
    <div class="stats-title">Run Complete</div>
    <div class="stat-row">
      <span class="stat-label">Adventurer</span>
      <span class="stat-value" id="s-name" style="font-size:1.3rem">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Time in Dungeon</span>
      <span class="stat-value" id="s-time">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Steps Taken</span>
      <span class="stat-value" id="s-steps">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Distance Walked</span>
      <span class="stat-value" id="s-dist">—<span class="stat-unit">m</span></span>
    </div>
    <div class="farewell" id="s-farewell">The dungeon remembers you.</div>
    <button class="stats-play-again" id="play-again-btn">Try Again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── LOGIN ────────────────────────────────────────────────────────────────────
const nameInput  = document.getElementById('name-input');
const enterBtn   = document.getElementById('enter-btn');
const loginScr   = document.getElementById('login-screen');
const gameScr    = document.getElementById('game-screen');
const statsScr   = document.getElementById('stats-screen');

nameInput.addEventListener('input', () => {
  enterBtn.disabled = nameInput.value.trim().length < 2;
});
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !enterBtn.disabled) startGame();
});
enterBtn.addEventListener('click', startGame);

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let playerName = '';
let startTime, timerInterval;
let steps = 0;
let distanceTravelled = 0;
let lastPos = null;

// Input
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup',   e => keys[e.code] = false);

// ─── THREE.JS SETUP ───────────────────────────────────────────────────────────
let renderer, scene, camera, playerGroup, nameLabel;
let animFrameId;

const ROOM = 10;      // half-size of room (room is 20x20)
const WALL_H = 4;
const PLAYER_SPEED = 5;
const PLAYER_R = 0.3;

function buildScene() {
  // Renderer
  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(canvas.offsetWidth, canvas.offsetHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080604);
  scene.fog = new THREE.Fog(0x080604, 12, 30);

  // Camera — isometric-ish top-down perspective
  camera = new THREE.PerspectiveCamera(50, canvas.offsetWidth / canvas.offsetHeight, 0.1, 100);
  camera.position.set(0, 14, 10);
  camera.lookAt(0, 0, 0);

  // ── ROOM GEOMETRY ──
  const stoneMat = new THREE.MeshLambertMaterial({ color: 0x1e1a14 });
  const darkMat  = new THREE.MeshLambertMaterial({ color: 0x0e0c08 });

  // Floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM*2, ROOM*2), stoneMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Floor grid lines (subtle)
  const gridHelper = new THREE.GridHelper(ROOM*2, 20, 0x2a2218, 0x1a1610);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);

  // Walls
  const wallMat = new THREE.MeshLambertMaterial({ color: 0x1a1712, side: THREE.FrontSide });
  const walls = [
    { pos: [0, WALL_H/2, -ROOM],  rot: 0,        size: [ROOM*2, WALL_H] },
    { pos: [0, WALL_H/2,  ROOM],  rot: Math.PI,   size: [ROOM*2, WALL_H] },
    { pos: [-ROOM, WALL_H/2, 0],  rot: Math.PI/2, size: [ROOM*2, WALL_H] },
    { pos: [ ROOM, WALL_H/2, 0],  rot:-Math.PI/2, size: [ROOM*2, WALL_H] },
  ];
  walls.forEach(w => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(...w.size), wallMat);
    m.position.set(...w.pos);
    m.rotation.y = w.rot;
    m.receiveShadow = true;
    scene.add(m);
  });

  // Ceiling (dark)
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM*2, ROOM*2), darkMat);
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = WALL_H;
  scene.add(ceiling);

  // Corner pillars
  const pillarGeo = new THREE.BoxGeometry(0.6, WALL_H, 0.6);
  const pillarMat = new THREE.MeshLambertMaterial({ color: 0x161310 });
  [[-ROOM,-ROOM],[ROOM,-ROOM],[-ROOM,ROOM],[ROOM,ROOM]].forEach(([x,z]) => {
    const p = new THREE.Mesh(pillarGeo, pillarMat);
    p.position.set(x, WALL_H/2, z);
    p.castShadow = true;
    scene.add(p);
  });

  // ── LIGHTING ──
  // Ambient — very dim
  scene.add(new THREE.AmbientLight(0x2a1f10, 0.4));

  // Central torch-like point light
  const torchLight = new THREE.PointLight(0xd4853a, 1.8, 20);
  torchLight.position.set(0, 3, 0);
  torchLight.castShadow = true;
  scene.add(torchLight);

  // Flickering via animation
  window._torchLight = torchLight;

  // Corner fill lights
  [[-7,1,-7],[7,1,-7],[-7,1,7],[7,1,7]].forEach(([x,y,z]) => {
    const l = new THREE.PointLight(0xc07020, 0.4, 8);
    l.position.set(x,y,z);
    scene.add(l);
  });

  // ── PLAYER ──
  playerGroup = new THREE.Group();
  playerGroup.position.set(0, 0, 0);

  // Body (capsule-ish: cylinder + 2 spheres)
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8a7a5a });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.9, 12), bodyMat);
  body.position.y = 0.9;
  body.castShadow = true;
  playerGroup.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), bodyMat);
  head.position.y = 1.65;
  head.castShadow = true;
  playerGroup.add(head);

  // Legs
  const legMat = new THREE.MeshLambertMaterial({ color: 0x6a5a3a });
  [-0.12, 0.12].forEach(x => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 8), legMat);
    leg.position.set(x, 0.25, 0);
    leg.castShadow = true;
    playerGroup.add(leg);
  });

  scene.add(playerGroup);
  lastPos = new THREE.Vector2(0, 0);

  // ── NAME LABEL (sprite texture) ──
  nameLabel = makeNameSprite(playerName);
  nameLabel.position.y = 2.2;
  playerGroup.add(nameLabel);

  // ── RESIZE ──
  window.addEventListener('resize', onResize);
}

function makeNameSprite(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 256, 64);
  ctx.font = 'bold 26px "Crimson Pro", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // shadow
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#d4a86e';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.2, 0.55, 1);
  return sprite;
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
let lastTime = 0;
let legAngle = 0;

function gameLoop(ts) {
  animFrameId = requestAnimationFrame(gameLoop);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  // Movement
  let dx = 0, dz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    dz -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  dz += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

  if (dx !== 0 || dz !== 0) {
    const len = Math.sqrt(dx*dx + dz*dz);
    dx /= len; dz /= len;

    let nx = playerGroup.position.x + dx * PLAYER_SPEED * dt;
    let nz = playerGroup.position.z + dz * PLAYER_SPEED * dt;

    // Wall collision
    const B = ROOM - PLAYER_R - 0.01;
    nx = Math.max(-B, Math.min(B, nx));
    nz = Math.max(-B, Math.min(B, nz));

    const moved = Math.sqrt(
      (nx - playerGroup.position.x)**2 +
      (nz - playerGroup.position.z)**2
    );
    distanceTravelled += moved;
    if (moved > 0.01) steps++;

    playerGroup.position.x = nx;
    playerGroup.position.z = nz;

    // Face direction
    playerGroup.rotation.y = Math.atan2(dx, dz) + Math.PI;

    // Leg animation
    legAngle += dt * 8;
    playerGroup.children.forEach((c, i) => {
      if (i === 3) c.rotation.x =  Math.sin(legAngle) * 0.5;
      if (i === 4) c.rotation.x = -Math.sin(legAngle) * 0.5;
    });
  }

  // Camera follows player
  camera.position.x = playerGroup.position.x;
  camera.position.z = playerGroup.position.z + 10;
  camera.lookAt(playerGroup.position.x, 0.5, playerGroup.position.z);

  // Torch flicker
  if (window._torchLight) {
    window._torchLight.intensity = 1.6 + Math.sin(ts * 0.003) * 0.15 + Math.sin(ts * 0.007) * 0.08;
  }

  renderer.render(scene, camera);
}

// ─── TIMER ────────────────────────────────────────────────────────────────────
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function startTimer() {
  startTime = Date.now();
  const el = document.getElementById('timer-display');
  timerInterval = setInterval(() => {
    el.textContent = formatTime(Date.now() - startTime);
  }, 1000);
}

// ─── START / END ──────────────────────────────────────────────────────────────
function startGame() {
  playerName = nameInput.value.trim() || 'Wanderer';
  loginScr.style.display = 'none';
  gameScr.style.display = 'block';

  buildScene();
  startTimer();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);

  // Fade out controls hint
  setTimeout(() => {
    document.getElementById('controls-hint').style.opacity = '0';
  }, 5000);

  document.getElementById('end-btn').addEventListener('click', endRun);
}

function endRun() {
  cancelAnimationFrame(animFrameId);
  clearInterval(timerInterval);

  const elapsed = Date.now() - startTime;

  // Fill stats
  document.getElementById('s-name').textContent  = playerName;
  document.getElementById('s-time').textContent  = formatTime(elapsed);
  document.getElementById('s-steps').textContent = steps.toLocaleString();
  document.getElementById('s-dist').innerHTML    =
    `${(distanceTravelled * 0.5).toFixed(1)}<span class="stat-unit">m</span>`;

  // Flavour farewell
  const t = Math.floor(elapsed/1000);
  let farewell = 'The dungeon remembers you.';
  if (t < 10)  farewell = 'You barely set foot inside...';
  else if (t < 30) farewell = 'A brief visit. The stones are not impressed.';
  else if (t < 120) farewell = 'The walls have memorised your footsteps.';
  else if (t < 300) farewell = 'Few wander this long and remain sane.';
  else         farewell = 'The dungeon has claimed a part of you.';
  document.getElementById('s-farewell').textContent = farewell;

  gameScr.style.display = 'none';
  statsScr.style.display = 'flex';
}

document.getElementById('play-again-btn').addEventListener('click', () => {
  // Reset state
  steps = 0;
  distanceTravelled = 0;
  statsScr.style.display = 'none';
  loginScr.style.display = 'flex';
  nameInput.value = '';
  enterBtn.disabled = true;
  document.getElementById('timer-display').textContent = '00:00';
  document.getElementById('controls-hint').style.opacity = '1';
  // Dispose renderer
  if (renderer) { renderer.dispose(); renderer = null; }
  window.removeEventListener('resize', onResize);
});
</script>
</body>
</html>
